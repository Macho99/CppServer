syntax = "proto3";
package Protocol;

import "Enum.proto";

message Vec3
{
	float x = 1;
	float y = 2;
	float z = 3;
}

message Vec2
{
	float x = 1;
	float y = 2;
}

message TransformData
{
	uint64 id = 1;
	Vec3 pos = 2;
	float yaw = 3;
	Vec2 velocity = 4;
	Vec2 blendInput = 5;
}

message AnimationData
{
	uint64 id = 1;
	uint32 animationIndex = 2;
	bool isDead = 3;
}

message HealthData
{
	uint64 id = 1;
	int32 hp = 2;
}

message Player
{
	uint64 id = 1;
	string name = 2;
	TransformData transform = 3;
	HealthData health = 4;
}

message Input
{
	int32 keyType = 1;
	bool down = 2;
}

message Monster
{
	uint64 id = 1;
	TransformData transform = 2;
	HealthData health = 3;
}