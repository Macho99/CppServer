syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN
{
	string name = 1;
}

message S_LOGIN
{
	bool success = 1;
	Player myPlayer = 2;
	repeated Player otherPlayers = 3;
	repeated Monster monsters = 4;
}

message S_PLAYER_ENTER
{
	repeated Player players = 1;
}

message S_PLAYER_EXIT
{
	repeated uint64 playerIds = 1;
}

message C_PLAYER_INPUT
{
	float cameraYaw = 1;
	repeated Input inputs = 2;
}

message C_PLAYER_SHOP_BUY
{
	int32 itemId = 1;
}

message S_PLAYER_ANIMATION
{
	AnimationData animationData = 1;
}

message S_PLAYER_MOVE
{
	repeated TransformData transforms = 1;
}

message S_PLAYER_HP_CHANGE
{
	repeated HealthData healths = 1;
}

message S_MONSTER_SPAWN
{
	repeated Monster monsters = 1;
}

message S_MONSTER_MOVE
{
	repeated TransformData transforms = 1;
}

message S_MONSTER_ANIMATION
{
	AnimationData animationData = 1;
}

message S_MONSTER_DESPAWN
{
	repeated uint64 monsterIds = 1;
}

message S_MONSTER_HP_CHANGE
{
	repeated HealthData healths = 1;
}

message S_STAT_CHANGE
{
	HealthData health = 1;
	StatData stat = 2;
}

message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	uint64 playerId = 1;
	string msg = 2;
}