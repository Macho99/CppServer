syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN
{
	string name = 1;
}

message S_LOGIN
{
	bool success = 1;
	Player myPlayer = 2;
	repeated Player otherPlayers = 3;
}

message S_PLAYER_ENTER
{
	repeated Player players = 1;
}

message S_PLAYER_EXIT
{
	repeated uint64 playerIds = 1;
}

message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	uint64 playerId = 1;
	string msg = 2;
}